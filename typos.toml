[default]
# Zig package hashes are base64 and will eventually spell something that looks
# like a misspelling. A dependency bump is not the place to find that out.
extend-ignore-re = ['\.hash = "[^"]*"']

[default.extend-words]
# `wRes` and friends: the Win32 Hungarian prefixes that appear in
# `WAVEFORMATEX` field names and in the generated bindings.
nChannels = "nChannels"
